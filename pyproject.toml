[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-bridge-engine"
version = "0.1.0"
description = "Climate-adaptive bridge survival and audit verification engine."
requires-python = ">=3.10"

[project.scripts]
bridge-data = "bridge_engine.data_pipeline:main"
bridge-survival = "bridge_engine.survival_models:main"
bridge-audit = "bridge_engine.audit_verifier:main"
bridge-triage = "bridge_engine.triage_and_xai:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
